name: reusable-java

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        required: false
        default: "25"
      build-tool:
        type: string
        required: false
        default: gradle
      image-name:
        type: string
        required: true
      push-image:
        type: boolean
        required: false
        default: false
      dockerfile:
        type: string
        required: false
        default: Dockerfile

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  test-build-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: ${{ inputs.build-tool == 'maven' && 'maven' || 'gradle' }}
      - uses: gradle/actions/setup-gradle@v6.3.0
        if: inputs.build-tool == 'gradle'
      - name: Test and package
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.build-tool }}" == "maven" ]]; then
            ./mvnw --batch-mode --no-transfer-progress verify
          else
            ./gradlew --no-daemon check build
          fi
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.6.0
        if: inputs.push-image
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ inputs.image-name }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push-image }}
          load: ${{ !inputs.push-image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.image-name }}:${{ steps.meta.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
