name: reusable-terraform

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        required: false
        default: .
      terraform-version:
        type: string
        required: false
        default: 1.16.1
      apply:
        type: boolean
        required: false
        default: false
      environment:
        type: string
        required: false
        default: infrastructure
    secrets:
      TF_BACKEND_CONFIG:
        required: false
      TF_VARS:
        required: false
      KUBE_CONFIG:
        required: false
      KEYCLOAK_USER:
        required: false
      KEYCLOAK_PASSWORD:
        required: false
      VAULT_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.apply && inputs.environment || '' }}
    concurrency:
      group: terraform-${{ github.repository }}-${{ inputs.working-directory }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      KEYCLOAK_USER: ${{ secrets.KEYCLOAK_USER }}
      KEYCLOAK_PASSWORD: ${{ secrets.KEYCLOAK_PASSWORD }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Scan repository for exposed secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: secret
          vuln-type: os
          format: table
          exit-code: "1"
      - name: Scan infrastructure configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          scan-type: config
          scan-ref: ${{ inputs.working-directory }}
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false
      - name: Write ephemeral configuration
        shell: bash
        env:
          BACKEND_CONFIG: ${{ secrets.TF_BACKEND_CONFIG }}
          TF_VARS_CONTENT: ${{ secrets.TF_VARS }}
          KUBE_CONFIG_CONTENT: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -n "$BACKEND_CONFIG" ]]; then
            printf '%s' "$BACKEND_CONFIG" > "$RUNNER_TEMP/backend.hcl"
          fi
          if [[ -n "$KUBE_CONFIG_CONTENT" ]]; then
            printf '%s' "$KUBE_CONFIG_CONTENT" > "$RUNNER_TEMP/kubeconfig.yaml"
            printf 'KUBE_CONFIG_PATH=%s\n' "$RUNNER_TEMP/kubeconfig.yaml" >> "$GITHUB_ENV"
          fi
          if [[ -n "$TF_VARS_CONTENT" ]]; then
            printf '%s' "$TF_VARS_CONTENT" > "$RUNNER_TEMP/runtime.auto.tfvars"
            cp "$RUNNER_TEMP/runtime.auto.tfvars" ./runtime.auto.tfvars
          fi
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Initialize backend
        shell: bash
        run: |
          if [[ -s "$RUNNER_TEMP/backend.hcl" ]]; then
            terraform init -input=false -backend-config="$RUNNER_TEMP/backend.hcl"
          else
            terraform init -input=false
          fi
      - name: Validate
        run: terraform validate
      - name: Plan
        run: terraform plan -lock-timeout=5m -out="$RUNNER_TEMP/tfplan"
      - name: Apply approved plan
        if: inputs.apply
        run: terraform apply -lock-timeout=5m -auto-approve "$RUNNER_TEMP/tfplan"
