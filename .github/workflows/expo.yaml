name: reusable-expo-mobile

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: false
        default: "24"
      package-manager:
        type: string
        required: false
        default: npm
      pnpm-version:
        type: string
        required: false
        default: "11.25.0"
      npm-scope:
        description: npm scope served by a private registry (e.g. "@cantalay"); empty keeps the public registry only.
        type: string
        required: false
        default: ""
      npm-registry:
        description: Registry URL for npm-scope.
        type: string
        required: false
        default: https://npm.pkg.github.com
      test-command:
        description: Package script run after install (npm/pnpm run, yarn <script>).
        type: string
        required: false
        default: test
      platform:
        type: string
        required: false
        default: all
      profile:
        type: string
        required: false
        default: production
      submit:
        type: boolean
        required: false
        default: false
    secrets:
      NPM_TOKEN:
        description: Registry token for npm-scope; defaults to the job GITHUB_TOKEN.
        required: false
      EXPO_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    environment: mobile-${{ inputs.profile }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Scan repository for exposed secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          cache-dir: ${{ runner.temp }}/trivy
          scan-type: fs
          scan-ref: .
          scanners: secret
          vuln-type: os
          format: table
          exit-code: "1"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        if: inputs.package-manager == 'pnpm'
        with:
          version: ${{ inputs.pnpm-version }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
      - uses: expo/expo-github-action@9.0.0
        with:
          eas-version: 23.2.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Configure npm scope registry
        if: inputs.npm-scope != ''
        shell: bash
        env:
          NPM_SCOPE: ${{ inputs.npm-scope }}
          NPM_REGISTRY: ${{ inputs.npm-registry }}
        run: |
          set -euo pipefail
          if [[ ! "$NPM_SCOPE" =~ ^@[a-z0-9][a-z0-9._-]*$ ]]; then echo "Invalid npm-scope: $NPM_SCOPE" >&2; exit 2; fi
          host="${NPM_REGISTRY#https://}"; host="${host%/}"
          # Token stays in the environment: ~/.npmrc only references ${NPM_TOKEN} (pnpm/npm expand user-level config).
          {
            echo "${NPM_SCOPE}:registry=${NPM_REGISTRY}"
            echo "//${host}/:_authToken=\${NPM_TOKEN}"
          } >> ~/.npmrc
          chmod 600 ~/.npmrc
      - name: Install and test
        shell: bash
        env:
          NPM_TOKEN: ${{ inputs.npm-scope != '' && (secrets.NPM_TOKEN || github.token) || '' }}
          TEST_COMMAND: ${{ inputs.test-command }}
        run: |
          set -euo pipefail
          case "${{ inputs.package-manager }}" in
            npm) npm ci && npm run "$TEST_COMMAND" ;;
            pnpm) pnpm install --frozen-lockfile && pnpm run "$TEST_COMMAND" ;;
            yarn) corepack enable && yarn install --immutable && yarn "$TEST_COMMAND" ;;
            *) exit 2 ;;
          esac
      - name: EAS build
        run: eas build --platform "${{ inputs.platform }}" --profile "${{ inputs.profile }}" --non-interactive --no-wait
      - name: EAS submit latest build
        if: inputs.submit
        run: eas submit --platform "${{ inputs.platform }}" --profile "${{ inputs.profile }}" --latest --non-interactive
