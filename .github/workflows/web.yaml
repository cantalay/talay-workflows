name: reusable-web

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: false
        default: "24"
      package-manager:
        type: string
        required: false
        default: npm
      build-command:
        type: string
        required: false
        default: build
      image-name:
        type: string
        required: true
      push-image:
        type: boolean
        required: false
        default: false
      dockerfile:
        type: string
        required: false
        default: Dockerfile
      upload-sarif:
        type: boolean
        required: false
        default: false
    secrets:
      GHCR_TOKEN:
        required: false

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  test-build-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
      - name: Install, test and build SPA
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          case "${{ inputs.package-manager }}" in
            npm)
              npm ci
              npm test
              npm run "${{ inputs.build-command }}"
              ;;
            pnpm)
              pnpm install --frozen-lockfile
              pnpm test
              pnpm run "${{ inputs.build-command }}"
              ;;
            yarn)
              yarn install --immutable
              yarn test
              yarn "${{ inputs.build-command }}"
              ;;
            *) exit 2 ;;
          esac
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.6.0
        if: inputs.push-image
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ inputs.image-name }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push-image }}
          load: ${{ !inputs.push-image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.image-name }}:${{ steps.meta.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && inputs.upload-sarif
        with:
          sarif_file: trivy-results.sarif
